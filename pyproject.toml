[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vankedoodle"
version = "0.1.0"
description = "Bayesian (model-informed) vancomycin dosing for children aged 1-18 years"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
web = ["streamlit>=1.28", "altair>=5.0", "pandas>=2.0"]
dev = ["pytest>=7.0", "streamlit>=1.28", "altair>=5.0", "pandas>=2.0"]

[project.scripts]
vankedoodle = "vankedoodle.cli:main"

[tool.setuptools]
packages = ["vankedoodle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
